# Collider themes: mirrors David's Drive folder "Collider Themes" into themes.json on its own.
# Runs on GitHub's own schedule (no bot, no usage) and on demand. Keyless: the folder is link-shared.
name: Collider Drive sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: collider-ingest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: ffmpeg
        run: which ffmpeg ffprobe || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Mirror Drive folder
        id: apply
        env:
          BUDGET_MIN: '50'
        run: python3 .github/ingest/drive_sync.py
      - name: Commit and push
        env:
          MSG: ${{ steps.apply.outputs.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "$MSG"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase -q origin main; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
