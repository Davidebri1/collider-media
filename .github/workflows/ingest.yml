# Collider media ingest: publishes media staged in Google Drive by the box sync routine.
# The box adds ingest/requests/<id>.json (text only) through a PR; this job downloads each listed file
# from its public Drive link, checks size + sha256, writes it to its new content-hashed path (never
# overwriting a published file), applies the request's themes.json, removes media it published earlier
# that nothing references any more, and commits as github-actions[bot]. Pages then redeploys.
name: Collider media ingest

on:
  push:
    branches: [main]
    paths: ['ingest/requests/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: collider-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply ingest requests
        id: apply
        run: python3 .github/ingest/apply.py
      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          MSG: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "$MSG"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase -q origin main; done
      - name: Request a Pages build
        if: steps.apply.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Fail if a request was rejected
        if: steps.apply.outputs.rejected == 'true'
        run: |
          cat ingest/last-result.json
          exit 1
